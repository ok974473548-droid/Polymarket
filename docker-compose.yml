# WhaleFollow на реальных данных Polymarket: три процесса из одного образа, общая база в томе /data.
#   api       — интерфейс и API (http://localhost:8787)
#   realtime  — агент, потоки WebSocket, сигналы, Telegram (всегда быстрый)
#   worker    — рынки, цены, пересчёт китов, резервные копии, проверки игроков (тяжёлое)
# Запуск: docker compose up -d --build   → http://localhost:8787
# Проверка доступа к Polymarket: docker compose run --rm api whalefollow check
# Всё в одном процессе, как до версии 0.15: docker compose run --rm -p 127.0.0.1:8787:8787 api whalefollow run --host 0.0.0.0

x-app: &app
  image: whalefollow:latest
  env_file: [.env]
  volumes: ["wf-data:/data"]
  restart: unless-stopped

services:
  migrate:
    # обновление схемы базы до запуска процессов (один раз при каждом старте)
    <<: *app
    build: .
    command: ["whalefollow", "init-db"]
    restart: "no"

  api:
    <<: *app
    command: ["whalefollow", "api", "--host", "0.0.0.0"]
    # Только с этого компьютера. Чтобы открыть с телефона или другого устройства в сети —
    # задайте WF_UI_PASSWORD в .env и замените на "8787:8787" (в интернет — только через HTTPS).
    ports: ["127.0.0.1:8787:8787"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  realtime:
    <<: *app
    command: ["whalefollow", "realtime"]
    healthcheck:
      test: ["CMD", "whalefollow", "alive", "realtime"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["whalefollow", "worker"]
    healthcheck:
      test: ["CMD", "whalefollow", "alive", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  wf-data:
