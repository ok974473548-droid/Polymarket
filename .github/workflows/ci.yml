name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (линтер)
        run: ruff check --output-format=github .
      - name: ruff (форматер)
        run: ruff format --check .
      - name: mypy
        run: mypy

  tests:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t whalefollow:ci .
      - name: Запуск и проверка интерфейса
        run: |
          docker run -d --name wf -p 8787:8787 -e WF_STREAMS=off whalefollow:ci \
            sh -c "whalefollow init-db && whalefollow serve --host 0.0.0.0"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/status && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/ | grep -q WhaleFollow
          curl -fsS http://127.0.0.1:8787/openapi.json | grep -q "WhaleFollow API"
          docker logs wf
          docker rm -f wf
