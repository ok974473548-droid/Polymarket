[project]
name = "whalefollow"
version = "1.7.0"
description = "WhaleFollow: отбор сильных игроков Polymarket и агент копирования ставок (v1: данные, скоринг, бэктест, бумажная торговля)"
requires-python = ">=3.11"
# Существующие зависимости — диапазонами (как в 0.13), новые пакеты — точными версиями; pandas заменён polars (0.16)
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi==0.163.2",
  "pydantic==2.14.3",
  "uvicorn==0.54.0",
  "httptools==0.9.0",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "httpx[http2]==0.28.1",
  "websockets==17.4",
  "alembic==1.20.1",
  "SQLAlchemy==2.1.9",
  "structlog==26.1.0",
  "polars==2.1.0",
  "duckdb==2.0.0",
  "pyarrow==26.0.1",
  "anthropic==2.10.0",  # модуль «События»: оценка исходов через Claude (официальный SDK, Apache-2.0)
  "cryptography==50.0.1",  # push-уведомления: шифрование сообщений и подпись VAPID
  "tzdata==2026.6",  # часовые пояса станций погоды (в образе python:slim системной базы может не быть)
]

[project.optional-dependencies]
api = []   # сервер FastAPI теперь в основных зависимостях; оставлено для старых команд установки
postgres = ["psycopg[binary]==3.3.9"]
sentry = ["sentry-sdk==2.75.0"]
dev = ["pytest==9.2.0", "ruff==0.17.5", "mypy==2.4.1", "pre-commit==4.7.0", "hypothesis==6.170.15"]

[project.scripts]
whalefollow = "whalefollow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whalefollow*"]

[tool.setuptools.package-data]
whalefollow = ["schema.sql", "web/*", "web/assets/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "eventhub/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["whalefollow/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF100", "PERF", "PLE"]
ignore = [
  "E501",    # длинные строки переносит форматер; оставшиеся — строки и SQL
  "E731",    # короткие lambda в таблицах маршрутов и настроек
  "B008",    # FastAPI: значения по умолчанию через Body()/Query()
  "B905",    # zip(strict=...) — длины совпадают по построению
  "SIM105",  # contextlib.suppress не короче try/except/pass
  "SIM108",  # тернарный оператор не всегда читаемее
  "PERF203", # try в цикле — сетевые запросы по одному
  "PERF401", # списковые включения не всегда читаемее
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "SIM117", "F811"]   # F811: фикстуры pytest, импортированные из других тестов
"whalefollow/migrations/versions/*" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["whalefollow"]
known-local-folder = ["conftest", "synthetic"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"   # линтер в CI работает на 3.12
files = ["whalefollow/scoring", "whalefollow/decision", "whalefollow/execution", "whalefollow/positions.py",
         "whalefollow/net.py", "whalefollow/api", "whalefollow/migrations/__init__.py", "whalefollow/logs.py",
         "whalefollow/ws.py", "whalefollow/rotation.py", "whalefollow/frames.py", "whalefollow/runtime.py",
         "whalefollow/plugins", "whalefollow/push.py", "whalefollow/eventhub"]
follow_imports = "silent"          # ошибки проверяются в перечисленных модулях; остальное — постепенно
ignore_missing_imports = true      # pandas/scipy без заглушек типов (pandas заменяется на этапе 3)
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
