[project]
name = "whalefollow"
version = "0.13.1"
description = "WhaleFollow: отбор сильных игроков Polymarket и агент копирования ставок (v1: данные, скоринг, бэктест, бумажная торговля)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
whalefollow = "whalefollow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whalefollow*"]

[tool.setuptools.package-data]
whalefollow = ["schema.sql", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
