# Проверки перед коммитом: pip install -e ".[dev]" && pre-commit install
# Ручной запуск по всем файлам: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^whalefollow/web/
      - id: trailing-whitespace
        exclude: ^whalefollow/web/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
  # ruff и mypy — из окружения проекта: те же версии, что в pyproject.toml и в CI
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (линтер)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (форматер)
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-env-file
        name: файл .env не коммитится
        entry: файл .env с ключами нельзя добавлять в репозиторий
        language: fail
        files: (^|/)\.env$
