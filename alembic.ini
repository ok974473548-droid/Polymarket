# Alembic для разработчиков: новая миграция — `alembic revision -m "что меняется"`,
# обновить базу вручную — `alembic upgrade head` (база берётся из WF_DB_URL).
# Приложение обновляет базу само при запуске (`whalefollow init-db`, `whalefollow run`).
[alembic]
script_location = whalefollow/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
